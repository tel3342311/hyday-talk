name: Windows

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  # Tests and packages the zip on Linux, with the engines committed in windows/runtime.
  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test core
        run: dotnet test tests/TalkCore.Tests -c Release
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hyday-talk-windows
          path: windows/dist/*.zip

  # Builds the app on Windows itself, rebuilding the engines with MSVC to check build-runtime.ps1.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test core
        run: dotnet test tests/TalkCore.Tests -c Release
      - name: Build recognition engines
        shell: pwsh
        run: ./scripts/build-runtime.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
