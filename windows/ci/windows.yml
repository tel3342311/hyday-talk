name: Windows

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test core
        run: dotnet test tests/TalkCore.Tests -c Release
      - name: Cache recognition engines
        uses: actions/cache@v4
        with:
          path: windows/.build/runtime
          key: runtime-${{ hashFiles('windows/scripts/build-runtime.ps1') }}
      - name: Build recognition engines
        shell: pwsh
        run: if (-not (Test-Path .build/runtime/transcribe-cli.exe)) { ./scripts/build-runtime.ps1 }
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -SkipRuntime
      - uses: actions/upload-artifact@v4
        with:
          name: hyday-talk-windows
          path: windows/dist/*.zip
